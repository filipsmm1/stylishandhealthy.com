name: SEO quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile SEO tools
        run: python -m py_compile .github/scripts/*.py

      - name: Validate canonicals, schema, links, redirects, and sitemap
        run: python .github/scripts/validate_seo.py

      - name: Verify 100 quick answers against published article FAQs
        run: python .github/scripts/generate_quick_answers.py --check
